<!doctype html>
<html lang="{{ site.lang }}" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <script>
    // Theme: "system", "light" or "dark". Runs before the page paints so there's no flash of the wrong colours.
    (function () {
      var root = document.documentElement;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function stored() {
        try { return localStorage.getItem("rv-theme") || "system"; } catch (e) { return "system"; }
      }
      function apply(pref) {
        var mode = pref === "system" ? (mq.matches ? "dark" : "light") : pref;
        root.setAttribute("data-color-mode", mode);
        root.setAttribute("data-theme", pref);
        document.dispatchEvent(new CustomEvent("rv-theme", { detail: { pref: pref, mode: mode } }));
      }
      window.rvTheme = {
        get: stored,
        set: function (pref) {
          try { localStorage.setItem("rv-theme", pref); } catch (e) {}
          apply(pref);
        }
      };
      mq.addEventListener("change", function () { if (stored() === "system") apply("system"); });
      apply(stored());
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/css@{{ site.primer_version }}/dist/primer.css">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <div class="layout">
    {% include sidebar.html %}
    <main id="main" class="main">
      {% if page.layout == "home" %}
        {{ content }}
      {% else %}
        {% include breadcrumbs.html %}
        <div class="article">
          <aside class="toc" aria-labelledby="toc-title">
            <h2 id="toc-title">In this article</h2>
            <ul id="toc-list"></ul>
          </aside>
          <article class="markdown-body">
            {{ content }}
          </article>
        </div>
      {% endif %}
      {% include footer.html %}
    </main>
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
