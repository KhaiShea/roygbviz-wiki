{%- capture sun -%}<svg class="icon-light" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg>{%- endcapture -%}
{%- capture moon -%}<svg class="icon-dark" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>{%- endcapture -%}
{%- capture screen -%}<svg class="icon-system" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14.5h5M8 11.5v3"/></svg>{%- endcapture -%}
<details class="theme-menu">
  <summary aria-label="Choose light or dark">{{ screen }}{{ sun }}{{ moon }}</summary>
  <div class="theme-options" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system" aria-pressed="false">{{ screen }} System</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">{{ sun }} Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">{{ moon }} Dark</button>
  </div>
</details>
